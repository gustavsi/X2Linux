name: X2Linux CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux-check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux & MinGW Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld gcc-mingw-w64-x86-64 spirv-tools fuse-overlayfs libvulkan-dev mesa-vulkan-drivers wine64
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - name: Check Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy -p x2l-gpu-vk -p x2l-rdna2-spirv --all-targets --features gpu-tests -- -D warnings
      - name: Build Native Core, PE Shims & Synthetic Test Fixture
        run: |
          cargo build -p x2l-core -p x2l-cli
          ./scripts/build_pe_shims.sh
          for dll in \
            kernelx.dll \
            xmem.dll \
            xgameruntime.dll \
            d3d12_xs.dll \
            xg_xs.dll \
            xcrdapi.dll \
            gameinput.dll \
            acphal.dll \
            xapu.dll \
            chad.dll \
            api-ms-win-core-psm-appnotify-l1-1-0.dll \
            api-ms-win-core-psm-appnotify-l1-1-1.dll \
            twinapi.appcore.dll; do
            test -f "target/pe-shims/debug/${dll}"
          done
          ./scripts/build_testtitle.sh
      - name: Run Workspace & OverlayFS Immutability Tests
        env:
          X2L_REQUIRE_TESTTITLE: "1"
        run: cargo test --workspace
      - name: Validate & Execute Emitted SPIR-V 1.6 Modules & Vulkan 1.3 Backend GPU Tests
        run: |
          cargo test -p x2l-rdna2-spirv --features spirv-val,gpu-tests -- --nocapture
          cargo test -p x2l-gpu-vk --features gpu-tests -- --nocapture
      - name: Verify CLI Help & Inspect Synthetic Fixture
        run: |
          cargo run -p x2l-cli -- --help
          cargo run -p x2l-cli -- inspect crates/x2l-testtitle/target/x86_64-pc-windows-gnu/debug/x2l-testtitle.exe --json
      - name: End-to-End Boot & Vulkan Triangle Render Tests (`--gpu null` + `--gpu vulkan` + Read-Only Verification)
        run: |
          set -euo pipefail
          FIXTURE_DIR="$(mktemp -d /tmp/x2l-ci-fixture.XXXXXX)"
          XDG_TMP="$(mktemp -d /tmp/x2l-ci-xdg.XXXXXX)"
          cp crates/x2l-testtitle/target/x86_64-pc-windows-gnu/debug/x2l-testtitle.exe "${FIXTURE_DIR}/"
          printf 'immutable-keep-payload\n' > "${FIXTURE_DIR}/fixture_keep.txt"
          printf 'original-modify-payload\n' > "${FIXTURE_DIR}/fixture_modify.txt"
          printf 'original-delete-payload\n' > "${FIXTURE_DIR}/fixture_delete.txt"
          ./scripts/verify_readonly.sh "${FIXTURE_DIR}" --snapshot /tmp/x2l-ci-lower.sha256

          # 1. M1 Null GPU backend regression check
          XDG_CONFIG_HOME="${XDG_TMP}/config" \
          XDG_DATA_HOME="${XDG_TMP}/data" \
          XDG_CACHE_HOME="${XDG_TMP}/cache" \
          ./target/debug/x2linux run "${FIXTURE_DIR}" --title-id ci-testtitle-null --gpu null
          ./scripts/verify_readonly.sh "${FIXTURE_DIR}" --verify /tmp/x2l-ci-lower.sha256
          REPORT_NULL="${XDG_TMP}/data/x2linux/ci-testtitle-null/logs/report.json"
          cat "${REPORT_NULL}"
          grep -q '"backend": "null"' "${REPORT_NULL}"
          grep -Eq '"network_mode": "(isolated_netns|proxy_sink_fallback)"' "${REPORT_NULL}"
          grep -q '"kernelx.dll#999"' "${REPORT_NULL}"
          grep -q '"ID3D12DeviceX\[45\]"' "${REPORT_NULL}"

          # 2. M2.4/M3.2/M3.3/M3.5 Direct Vulkan 1.3 headless render + expanded D3D12.X + --trace-hle on Lavapipe
          FRAME_DUMP="/tmp/x2l-ci-frame.ppm"
          rm -f "${FRAME_DUMP}"
          XDG_CONFIG_HOME="${XDG_TMP}/config" \
          XDG_DATA_HOME="${XDG_TMP}/data" \
          XDG_CACHE_HOME="${XDG_TMP}/cache" \
          X2L_VK_DEVICE="llvmpipe" \
          X2L_TEST_RENDER="1" \
          X2L_FRAME_DUMP="${FRAME_DUMP}" \
          ./target/debug/x2linux run "${FIXTURE_DIR}" --title-id ci-testtitle-vk --gpu vulkan --headless --trace-hle
          ./scripts/verify_readonly.sh "${FIXTURE_DIR}" --verify /tmp/x2l-ci-lower.sha256
          REPORT_VK="${XDG_TMP}/data/x2linux/ci-testtitle-vk/logs/report.json"
          LOG_VK="${XDG_TMP}/data/x2linux/ci-testtitle-vk/logs/x2linux.log"
          cat "${REPORT_VK}"
          grep -q '"backend": "vulkan"' "${REPORT_VK}"
          grep -Eq '"network_mode": "(isolated_netns|proxy_sink_fallback)"' "${REPORT_VK}"
          grep -q '"present_surface": "headless"' "${REPORT_VK}"
          grep -q '"shaders_compiled": 8' "${REPORT_VK}"
          grep -q '"frames_presented": 2' "${REPORT_VK}"
          grep -q '"kernelx.dll#999"' "${REPORT_VK}"
          grep -q '"ID3D12DeviceX\[45\]"' "${REPORT_VK}"
          grep -q '"xgameruntime.dll!XGameRuntimeSyntheticMissingProbe"' "${REPORT_VK}"
          grep -q '"QueryApiImpl\[deadbeef-1234-5678-9abc-def012345678/11112222-3333-4444-5555-666677778888\]"' "${REPORT_VK}"
          ! grep -q '"last_exception"' "${REPORT_VK}"
          grep -q '\[HLE\]' "${LOG_VK}"
          grep -q '\[DEBUGSTR\] \[TESTTITLE\] debugstr probe' "${LOG_VK}"
          grep -q '\[MISSING_PROC\]' "${LOG_VK}"
          python3 -c "
          data = open('${FRAME_DUMP}', 'rb').read()
          hdr = b'P6\n64 64\n255\n'
          assert data.startswith(hdr), 'unexpected PPM header'
          rgb = data[len(hdr):]
          assert len(rgb) == 64 * 64 * 3, f'unexpected RGB length {len(rgb)}'
          px = lambda x, y: (rgb[(y * 64 + x) * 3], rgb[(y * 64 + x) * 3 + 1], rgb[(y * 64 + x) * 3 + 2])
          assert px(16, 16) == (255, 0, 0), f'TL quadrant mismatch: {px(16, 16)}'
          assert px(48, 16) == (0, 255, 0), f'TR quadrant mismatch: {px(48, 16)}'
          assert px(16, 48) == (0, 0, 255), f'BL quadrant mismatch: {px(16, 48)}'
          assert px(48, 48) == (255, 255, 0), f'BR quadrant mismatch: {px(48, 48)}'
          print(f'[CI PPM PASS] TL={px(16, 16)} TR={px(48, 16)} BL={px(16, 48)} BR={px(48, 48)}')
          "

          WINEPREFIX="${XDG_TMP}/data/x2linux/ci-testtitle-null/prefix" wineserver -w 2>/dev/null || true
          WINEPREFIX="${XDG_TMP}/data/x2linux/ci-testtitle-vk/prefix" wineserver -w 2>/dev/null || true
          chmod -R u+rwx "${XDG_TMP}" 2>/dev/null || true
          rm -rf "${FIXTURE_DIR}" "${XDG_TMP}" /tmp/x2l-ci-lower.sha256 "${FRAME_DUMP}" || true
      - name: License & Advisory Audit (GPL-3.0-or-later)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses advisories
